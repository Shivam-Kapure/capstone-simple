# Local test stack. Host ports 38080/38081 were checked free (see PORTS.md).
services:
  backend:
    build: ./backend
    image: payment-backend:capstone
    container_name: capstone-backend
    ports:
      - "38081:8000"

  frontend:
    build: ./frontend
    image: payment-frontend:capstone
    container_name: capstone-frontend
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "38080:80"
    depends_on:
      backend:
        condition: service_healthy
