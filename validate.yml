# Validates the Terraform-generated connection file and the running application.
# Run from the project folder in WSL:
#   ansible-playbook validate.yml
# Override the URL used for the live health check (must be reachable from where Ansible runs):
#   ansible-playbook validate.yml -e app_url=http://localhost:38080
- name: Validate capstone connection configuration and application health
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    env_file: "{{ playbook_dir }}/capstone.env"
    # Docker Compose frontend; the Minikube tunnel only listens on the Windows side, not in WSL.
    app_url: "http://localhost:38080"

  tasks:
    - name: Check that capstone.env exists
      ansible.builtin.stat:
        path: "{{ env_file }}"
      register: env_stat

    - name: Fail if capstone.env is missing
      ansible.builtin.assert:
        that: env_stat.stat.exists and env_stat.stat.isreg
        fail_msg: "{{ env_file }} not found - run 'terraform apply' first."
        quiet: true

    - name: Read capstone.env
      ansible.builtin.slurp:
        src: "{{ env_file }}"
      register: env_raw

    - name: Parse KEY=VALUE lines
      ansible.builtin.set_fact:
        capstone_env: >-
          {{ dict((env_raw.content | b64decode).splitlines()
                  | select('match', '^[A-Z_]+=')
                  | map('split', '=', 1)) }}

    - name: Validate required settings
      ansible.builtin.assert:
        that:
          - capstone_env.PAYMENT_GATEWAY_URL | default('') | length > 0
          - capstone_env.PAYMENT_GATEWAY_URL is match('^https?://[^/]+')
          - capstone_env.STATUS | default('') == 'DEPLOYED'
        fail_msg: "capstone.env is invalid: {{ capstone_env }}"
        success_msg: "capstone.env OK: {{ capstone_env }}"

    - name: Check backend health through the frontend proxy
      ansible.builtin.uri:
        url: "{{ app_url }}/health"
        return_content: true
        timeout: 10
      register: health
      failed_when: health.status != 200 or health.json.status | default('') != 'healthy'

    - name: Check payments API through the frontend proxy
      ansible.builtin.uri:
        url: "{{ app_url }}/api/payments"
        timeout: 10
      register: payments
      failed_when: payments.status != 200 or (payments.json | length) == 0

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "PAYMENT_GATEWAY_URL = {{ capstone_env.PAYMENT_GATEWAY_URL }}"
          - "STATUS              = {{ capstone_env.STATUS }}"
          - "Health check        = {{ app_url }}/health -> {{ health.status }} {{ health.json.status }} (v{{ health.json.version }})"
          - "Payments API        = {{ app_url }}/api/payments -> {{ payments.status }}, {{ payments.json | length }} records"
